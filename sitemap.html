<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Directory &amp; Media Index</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
    h1, h2 { border-bottom: 1px solid #333; padding-bottom: 0.4rem; }
    h3 { margin: 1.5rem 0 0.5rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    ul { line-height: 1.8; }
    a { color: #7cc4ff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-top: 0.75rem; }
    .card { background: #1b1b1b; border: 1px solid #2e2e2e; border-radius: 8px; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .card img, .card video { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; background: #000; }
    .path { font-family: monospace; font-size: 0.8rem; word-break: break-all; color: #bbb; }
    button { background: #2b579a; color: #fff; border: none; border-radius: 4px; padding: 0.4rem 0.6rem; cursor: pointer; font-size: 0.85rem; }
    button:hover { background: #366ec2; }
    .copy-all { background: #234736; }
    .copy-all:hover { background: #2e5e48; }
  </style>
</head>
<body>
  <h1>Site Pages</h1>
  <ul>
    <li><a href="index.html">Home / Gallery (index.html)</a></li>
    <li><a href="about.html">About (about.html)</a></li>
    <li><a href="journal.html">Journal (journal.html)</a></li>
    <li><a href="admin.html">Admin Panel (admin.html)</a></li>
  </ul>

  <h2>Indexed Media (<span id="count">0</span>)</h2>
  <div id="media-container">Loading manifest...</div>

  <script>
    function createCard(item) {
      const isVideo = /\.(mp4|webm|mov)$/i.test(item.path);
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        ${isVideo
          ? `<video src="${item.path}" muted preload="metadata"></video>`
          : `<img src="${item.path}" alt="${item.name}" loading="lazy" />`}
        <div class="path">${item.path} (${item.sizeMB} MB)</div>
        <button type="button">Copy Path</button>
      `;
      card.querySelector("button").addEventListener("click", (e) => {
        navigator.clipboard.writeText(item.path);
        e.target.textContent = "Copied!";
        setTimeout(() => (e.target.textContent = "Copy Path"), 1200);
      });
      return card;
    }

    async function loadManifest() {
      const container = document.getElementById("media-container");
      try {
        const res = await fetch("media-manifest.json?v=" + Date.now());
        if (!res.ok) throw new Error("media-manifest.json not found");
        const data = await res.json();
        const items = data.items || [];
        document.getElementById("count").textContent = data.count ?? items.length;
        container.innerHTML = "";

        const groups = new Map();
        items.forEach(item => {
          const parts = (item.path || "").split("/");
          const folderName = item.folder || (parts.length > 2 ? parts[1] : "media (root)");
          if (!groups.has(folderName)) groups.set(folderName, []);
          groups.get(folderName).push(item);
        });

        groups.forEach((folderItems, folderName) => {
          const heading = document.createElement("h3");
          const label = document.createElement("span");
          label.textContent = `${folderName} (${folderItems.length})`;

          const copyAllBtn = document.createElement("button");
          copyAllBtn.type = "button";
          copyAllBtn.className = "copy-all";
          copyAllBtn.textContent = "Copy All Paths";
          copyAllBtn.addEventListener("click", () => {
            const allPaths = folderItems.map(i => i.path).join("\n");
            navigator.clipboard.writeText(allPaths);
            copyAllBtn.textContent = "Copied All!";
            setTimeout(() => (copyAllBtn.textContent = "Copy All Paths"), 1200);
          });

          heading.appendChild(label);
          heading.appendChild(copyAllBtn);

          const grid = document.createElement("div");
          grid.className = "grid";
          folderItems.forEach(item => grid.appendChild(createCard(item)));

          container.appendChild(heading);
          container.appendChild(grid);
        });
      } catch (err) {
        container.textContent = "Could not load media-manifest.json: " + err.message;
      }
    }
    loadManifest();
  </script>
</body>
</html>
