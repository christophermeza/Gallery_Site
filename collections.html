<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collections | Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container">
    <section class="section-header-row">
      <h1 id="collection-title" class="page-heading">Collections</h1>
      <div class="header-right-group">
        <button id="back-to-albums" class="btn btn-secondary hidden" type="button">← Back to Collections</button>
      </div>
    </section>

    <section id="collections-grid" class="collections-grid" aria-label="Collections"></section>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Media viewer">
    <button id="lightbox-close" type="button" aria-label="Close viewer">✕</button>
    <button id="lightbox-prev" type="button" aria-label="Previous media">‹</button>
    <div id="lightbox-content"></div>
    <button id="lightbox-next" type="button" aria-label="Next media">›</button>
    <p id="lightbox-caption"></p>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="cloudinary.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
