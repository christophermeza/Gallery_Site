<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="title-screen" aria-hidden="true">
    <h1>Personal Gallery &amp; Diary</h1>
    <p>Moments, Stories &amp; Visuals</p>
  </div>

  <div id="navbar-placeholder"></div>

  <main class="container">
    <section class="section-header">
      <h1 id="home-page-title" class="page-title">Featured Highlights</h1>
      <div id="home-admin-actions" class="admin-inline-actions hidden">
        <button id="toggle-home-edit-btn" class="btn" type="button">Edit Page</button>
        <button id="save-home-inline-btn" class="btn hidden" type="button">Save Changes</button>
        <button id="cancel-home-inline-btn" class="btn btn-secondary hidden" type="button">Cancel</button>
      </div>
    </section>

    <section class="hero-banner">
      <h2 id="home-hero-heading">Welcome to the Archive</h2>
      <p id="home-hero-subtext">A personal collection of photography, motion clips, and written memories organized into curated albums and diary entries.</p>
      <div class="hero-actions">
        <a href="media.html" class="btn">Explore All Media</a>
        <a href="collections.html" class="btn">Browse Collections</a>
      </div>
      <p id="home-save-status" class="editor-status"></p>
    </section>

    <section id="home-highlights" class="media-grid" aria-label="Featured highlights"></section>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Media viewer">
    <button id="lightbox-close" type="button" aria-label="Close viewer">✕</button>
    <button id="lightbox-prev" type="button" aria-label="Previous media">‹</button>
    <div id="lightbox-content"></div>
    <button id="lightbox-next" type="button" aria-label="Next media">›</button>
    <p id="lightbox-caption"></p>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="cloudinary.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
