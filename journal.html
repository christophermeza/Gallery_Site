<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diary | Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container">
    <section class="section-header-row">
      <h1 class="page-heading">Memory Diary</h1>
      <button id="add-journal-entry-btn" class="btn hidden" type="button">+ Add Entry</button>
    </section>

    <form id="journal-editor-panel" class="inline-editor-panel editor-panel hidden">
      <h3 id="journal-editor-heading">New Diary Entry</h3>
      <input id="journal-doc-id" type="hidden" />

      <div class="editor-grid-2">
        <div>
          <label class="editor-label" for="journal-title-input">Creative Display Title</label>
          <input id="journal-title-input" class="editor-input" type="text" placeholder="Enter display title" required />
        </div>
        <div>
          <label class="editor-label" for="journal-date-input">Date</label>
          <input id="journal-date-input" class="editor-input" type="date" required />
        </div>
      </div>

      <div class="media-picker-box">
        <div class="media-picker-header">
          <span class="editor-label">Cloudinary Media</span>
          <div class="admin-inline-actions">
            <button id="toggle-journal-media-picker-btn" class="btn" type="button">Select Media</button>
            <button id="clear-journal-media-btn" class="btn btn-secondary hidden" type="button">Clear</button>
          </div>
        </div>
        <p id="journal-selected-media-label" class="media-picker-selection-status">No media selected.</p>
        <div id="journal-media-picker-grid" class="media-picker-grid hidden" role="listbox" aria-label="Select media from Cloudinary"></div>
      </div>

      <div class="editor-grid-2">
        <div>
          <label class="editor-label" for="journal-alt-input">Alt Text / Fallback Caption</label>
          <input id="journal-alt-input" class="editor-input" type="text" placeholder="Describe what appears in the media" />
        </div>
        <div>
          <label class="editor-label" for="journal-location-input">Location</label>
          <input id="journal-location-input" class="editor-input" type="text" placeholder="City, State or Country" />
        </div>
      </div>

      <div class="editor-grid-2">
        <div>
          <label class="editor-label" for="journal-people-input">People (comma-separated)</label>
          <input id="journal-people-input" class="editor-input" type="text" placeholder="Name 1, Name 2" />
        </div>
        <div>
          <label class="editor-label" for="journal-tags-input">Tags (comma-separated)</label>
          <input id="journal-tags-input" class="editor-input" type="text" placeholder="tag1, tag2, tag3" />
        </div>
      </div>

      <div class="editor-grid-2">
        <div>
          <label class="editor-label" for="journal-camera-input">Camera / Device</label>
          <input id="journal-camera-input" class="editor-input" type="text" placeholder="Camera or device used" />
        </div>
        <div>
          <label class="editor-label" for="journal-resolution-input">Resolution / Dimensions</label>
          <input id="journal-resolution-input" class="editor-input" type="text" placeholder="Width x Height px" />
        </div>
      </div>

      <label class="editor-label" for="journal-desc-input">Story / Journal Description</label>
      <textarea id="journal-desc-input" class="editor-textarea" rows="4" placeholder="Write notes, context, or journal thoughts..."></textarea>

      <p id="journal-save-status" class="editor-status"></p>

      <div class="admin-inline-actions" style="margin-top: 14px;">
        <button type="submit" class="btn">Save Entry</button>
        <button id="cancel-journal-edit-btn" type="button" class="btn btn-secondary">Cancel</button>
      </div>
    </form>

    <section id="journal-feed" class="journal-list" aria-label="Diary entries"></section>
  </main>

  <div id="entry-detail-modal" class="entry-detail-modal hidden" role="dialog" aria-modal="true" aria-label="Diary entry details">
    <div id="entry-detail-content" class="entry-detail-card"></div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="cloudinary.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
